name: Build VirtualApp APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Update Gradle Wrapper
        run: |
          cd VirtualApp
          sed -i 's|gradle-4.1-all|gradle-7.6-all|' gradle/wrapper/gradle-wrapper.properties

      - name: Fix Root Build Gradle
        run: |
          cd VirtualApp
          cat > build.gradle << 'GRADLE_EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          GRADLE_EOF

      - name: Fix All compile() to implementation()
        run: |
          cd VirtualApp
          find . -name "build.gradle" -exec sed -i 's/\bcompile\b/implementation/g' {} +
          sed -i 's/android.useDeprecatedNdk=true/android.useDeprecatedNdk=false/' gradle.properties

      - name: Remove Dead Dependencies
        run: |
          cd VirtualApp
          sed -i '/once:once/d' app/build.gradle
          sed -i '/flurry.android/d' app/build.gradle
          sed -i '/kyleduo.switchbutton/d' app/build.gradle
          sed -i '/switchbutton/d' app/build.gradle
          sed -i '/once/d' app/build.gradle
          sed -i '/flurry/d' app/build.gradle

      - name: Remove Java References
        run: |
          cd VirtualApp
          find . -name "*.java" -exec sed -i '/import com.flurry/d' {} +
          find . -name "*.java" -exec sed -i '/import com.kyleduo/d' {} +
          find . -name "*.java" -exec sed -i '/import com.jonathanfinerty/d' {} +

      - name: Show Line 93 Before Fix
        run: |
          cd VirtualApp
          sed -n '90,96p' lib/src/main/java/com/lody/virtual/client/hook/proxies/am/ActivityManagerStub.java

      - name: Fix Type Casting
        run: |
          cd VirtualApp
          # Fix all ParceledListSlice type issues
          find . -name "*.java" -exec sed -i 's/\(List<[^>]*>\) \([a-zA-Z_]*\) = slice ? ParceledListSlice.getList.call(\([^)]*\))/\1 \2 = slice ? (\1)(List<?>)ParceledListSlice.getList.call(\3)/g' {} +

      - name: Show Line 93 After Fix
        run: |
          cd VirtualApp
          sed -n '90,96p' lib/src/main/java/com/lody/virtual/client/hook/proxies/am/ActivityManagerStub.java

      - name: Grant execute permission
        run: chmod +x VirtualApp/gradlew

      - name: Build APK
        run: |
          cd VirtualApp
          ./gradlew assembleDebug 2>&1 | grep -E "error|FAILED|What went wrong|BUILD" | head -40

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp-Debug
          path: VirtualApp/app/build/outputs/apk/debug/*.apk
