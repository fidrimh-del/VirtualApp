name: Build VirtualApp APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Update Gradle Wrapper
        run: |
          cd VirtualApp
          sed -i 's|gradle-4.1-all|gradle-7.6-all|' gradle/wrapper/gradle-wrapper.properties

      - name: Fix Build Gradle
        run: |
          cd VirtualApp
          cat > build.gradle << 'GRADLE_EOF'
          buildscript {
              repositories {
                  google()
                  jcenter()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  jcenter()
                  mavenCentral()
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          GRADLE_EOF

      - name: Grant execute permission
        run: chmod +x VirtualApp/gradlew

      - name: Build APK
        run: |
          cd VirtualApp
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp-Debug
          path: VirtualApp/app/build/outputs/apk/debug/*.apk
